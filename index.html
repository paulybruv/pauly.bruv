<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Character & Viewport Settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Pauly Bruv Engraving | Bespoke Laser Artistry & Custom Gifts</title>
    <meta
      name="description"
      content="Custom laser-engraved gifts, tactical slate coasters, 3D layered signs, and point-of-sale displays crafted in Birmingham."
    />
    <meta
      name="keywords"
      content="laser engraving, bespoke gifts, slate coasters, Birmingham craft, custom wood signs, 3D signs"
    />
    <meta name="author" content="Pauly Bruv" />

    <!-- Social Share Cards (Open Graph - Used by X, Facebook, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://paulybruv.github.io/" />
    <meta
      property="og:title"
      content="Pauly Bruv Engraving | Bespoke Laser Artistry"
    />
    <meta
      property="og:description"
      content="High-precision laser-etched slate, timber, and custom keepsakes tailored to your vision."
    />
    <meta property="og:image" content="assets/images/hero-banner.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Main Sticky Navigation -->
    <nav
      class="navbar navbar-expand-lg border-bottom sticky-top shadow-sm py-3 bg-white"
      aria-label="Main Navigation"
    >
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#hero">
          <span class="fw-bold tracking-tight">PAULY BRUV ENGRAVING</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#workshopNav"
          aria-controls="workshopNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="workshopNav">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item"><a class="nav-link" href="#hero">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#products">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">About the Maker</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#socials">Follow Us</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-custom px-3 ms-lg-2" href="#contact"
                >Custom Quote</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="py-5 bg-light-section">
      <div class="container">
        <div class="row align-items-center gap-4 gap-lg-0">
          <div class="col-lg-6 text-center text-lg-start">
            <h1 class="display-5 fw-bold text-dark mb-3">
              Custom Laser Engraving &amp; Bespoke Gifts
            </h1>
            <p class="lead text-secondary mb-4">
              From Tactical Football Coasters to 3D MDF Street Signs — Precision
              Laser Crafting Made in Birmingham.
            </p>
            <div
              class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-3"
            >
              <a href="#products" class="btn btn-custom px-4 py-2"
                >Explore Products</a
              >
              <a href="#contact" class="btn btn-outline-custom px-4 py-2"
                >Request Custom Order</a
              >
            </div>
          </div>
          <div class="col-lg-6">
            <img
              src="assets/images/hero-banner.jpg"
              alt="Set of laser-engraved tactical football slate coasters with Dad mug"
              class="img-fluid rounded-3 shadow card-img-hero"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap Bundle JS (Required for mobile menu toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
